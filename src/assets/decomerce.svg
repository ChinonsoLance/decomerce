<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ember" x1="10" y1="6" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffc27a" />
      <stop offset="0.5" stop-color="#ff9c2b" />
      <stop offset="1" stop-color="#c2620a" />
    </linearGradient>
    <linearGradient id="plate" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2e1a0c" />
      <stop offset="1" stop-color="#150c05" />
    </linearGradient>
  </defs>

  <!-- plate -->
  <rect x="3" y="3" width="58" height="58" rx="17" fill="url(#plate)" />
  <rect x="3.75" y="3.75" width="56.5" height="56.5" rx="16.25"
        stroke="url(#ember)" stroke-opacity="0.55" stroke-width="1.5" />

  <!-- the arch: a window, a headboard, a doorway -->
  <path d="M20 46V29a12 12 0 0 1 24 0v17"
        stroke="url(#ember)" stroke-width="3" stroke-linecap="round" />
  <!-- the horizon line beneath it -->
  <path d="M15 46h34" stroke="url(#ember)" stroke-width="3" stroke-linecap="round" />
  <!-- inner glow -->
  <path d="M27 46v-9a5 5 0 0 1 10 0v9" stroke="#ffc27a" stroke-opacity="0.45"
        stroke-width="2" stroke-linecap="round" />
</svg>
