<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img">
  <title>Joyce Interiors</title>

  <!-- The plate: a rounded square, drawn rather than filled, so the mark reads
       as a frame around the letter — a doorway, which is the whole business. -->
  <rect x="8.6" y="5.6" width="46.8" height="52.8" rx="16"
        stroke="#F28C28" stroke-width="3.2" />

  <!-- The J. One continuous silhouette: a stem cut on the diagonal at the top,
       falling into an open hook. The counter is left empty so the letter still
       breathes at 32px. -->
  <path d="M37 21 L43 16 V36
           A11 11 0 0 1 21 36
           V28 H27 V36
           A5 5 0 0 0 37 36 Z"
        fill="#F28C28" />
</svg>
