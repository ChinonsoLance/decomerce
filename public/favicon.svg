<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Solid plate at favicon sizes: a 3px outline turns to mush at 16px, so the
       frame becomes the fill and the letter is knocked out of it. The letter is
       set a touch heavier than the full lockup for the same reason. -->
