<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Joyce Interiors — Admin</title>
<style>
  /* The storefront's language: warm paper, one marigold accent, one typeface. */
  :root {
    --cloud: #faf7f2;
    --canvas: #fffdfa;
    --ink: #1c1a17;
    --stone: #6f6961;
    --line: #e6dfd4;
    --brand: #e8a33d;
    --brand-600: #c9821f;
    --danger: #b4432b;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--cloud);
    color: var(--ink);
    font: 14px/1.55 "Montserrat", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; padding: 18px 28px; background: var(--canvas);
    border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10;
  }
  .brand { font-weight: 800; letter-spacing: .22em; font-size: 13px; text-transform: uppercase; }
  .brand em { color: var(--brand-600); font-style: normal; }
  main { max-width: 1180px; margin: 0 auto; padding: 28px; }
  h2 { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--stone); margin: 0 0 14px; font-weight: 700; }
  .panel { background: var(--canvas); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
  .grid { display: grid; grid-template-columns: 360px 1fr; gap: 24px; align-items: start; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  label { display: block; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--stone); font-weight: 700; margin: 14px 0 6px; }
  input, select, button {
    font: inherit; width: 100%; padding: 10px 12px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--canvas); color: var(--ink);
  }
  input:focus, select:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
  button {
    cursor: pointer; font-weight: 700; letter-spacing: .06em;
    background: var(--ink); color: var(--cloud); border-color: var(--ink);
    transition: opacity .2s;
  }
  button:hover { opacity: .86; }
  button.primary { background: var(--brand); border-color: var(--brand); color: #2a1c05; }
  button.ghost { background: transparent; color: var(--stone); border-color: var(--line); }
  button.danger { background: transparent; color: var(--danger); border-color: var(--line); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .muted { color: var(--stone); font-size: 12px; }
  .drop {
    border: 1.5px dashed var(--line); border-radius: 11px; padding: 18px;
    text-align: center; cursor: pointer; background: var(--cloud);
  }
  .drop.hot { border-color: var(--brand); background: #fff6e8; }
  .drop img { max-height: 150px; border-radius: 8px; display: block; margin: 0 auto 8px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--stone); padding: 0 10px 10px; }
  td { padding: 10px; border-top: 1px solid var(--line); vertical-align: middle; }
  td img { width: 54px; height: 54px; object-fit: cover; border-radius: 8px; background: var(--cloud); display: block; }
  .pill { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; background: var(--cloud); border: 1px solid var(--line); color: var(--stone); }
  .pill.on { background: var(--brand); border-color: var(--brand); color: #2a1c05; }
  .toast {
    position: fixed; right: 20px; bottom: 20px; max-width: 340px; padding: 13px 16px;
    border-radius: 11px; background: var(--ink); color: var(--cloud); font-size: 13px;
    box-shadow: 0 12px 30px rgba(0,0,0,.18); opacity: 0; transform: translateY(8px);
    transition: .25s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: none; }
  .toast.bad { background: var(--danger); }
  .login { max-width: 380px; margin: 8vh auto; }
  .actions { display: flex; gap: 6px; justify-content: flex-end; }
  .actions button { width: auto; padding: 7px 12px; font-size: 12px; }
  .hide { display: none !important; }
</style>
</head>
<body>

<header>
  <div class="brand">deco<em>merce</em> · admin</div>
  <div class="row" style="width:auto;gap:10px;align-items:center">
    <span id="who" class="muted"></span>
    <button id="logout" class="ghost hide" style="width:auto;padding:7px 14px">Sign out</button>
  </div>
</header>

<main>
  <section id="loginView" class="panel login">
    <h2>Administrator</h2>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" placeholder="admin@decomerce.com" />
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" />
    <div style="height:18px"></div>
    <button id="signin" class="primary">Sign in</button>
  </section>

  <section id="appView" class="grid hide">
    <div class="panel">
      <h2 id="formTitle">Add a product</h2>

      <label for="name">Product name</label>
      <input id="name" placeholder="Aurelia Pocket-Spring Mattress" />

      <label for="category">Category</label>
      <select id="category"></select>

      <label for="spec">Spec line</label>
      <input id="spec" placeholder="6ft × 6ft · Medium-firm · 12in" />

      <div class="row">
        <div>
          <label for="badge">Badge</label>
          <select id="badge"></select>
        </div>
        <div>
          <label for="published">Visibility</label>
          <select id="published">
            <option value="true">Published</option>
            <option value="false">Draft</option>
          </select>
        </div>
      </div>

      <label>Photo</label>
      <div id="drop" class="drop">
        <div id="dropInner"></div>
      </div>
      <input id="file" type="file" accept="image/*" class="hide" />

      <label for="imageUrl">…or paste an image URL</label>
      <input id="imageUrl" placeholder="https://images.unsplash.com/photo-…" />

      <div style="height:18px"></div>
      <div class="row">
        <button id="save" class="primary">Save product</button>
        <button id="cancel" class="ghost hide">Cancel</button>
      </div>
    </div>

    <div class="panel">
      <h2>Catalogue <span id="count" class="muted"></span></h2>
      <div class="row" style="margin-bottom:14px">
        <input id="search" placeholder="Search products…" />
        <select id="filter"></select>
      </div>
      <table>
        <thead>
          <tr>
            <th style="width:66px"></th>
            <th>Product</th>
            <th>Category</th>
            <th style="width:96px">State</th>
            <th style="width:150px"></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="empty" class="muted hide" style="padding:26px 10px">
        Nothing here yet. Add the first product on the left.
      </div>
    </div>
  </section>
</main>

<div id="toast" class="toast"></div>

<script type="module">
/* The admin console. Served from the API's own origin, so every fetch is
   same-origin and there is no build step to run. */

const $ = (id) => document.getElementById(id);

let token = localStorage.getItem("decomerce_token") || "";
let editingId = null;
let pickedFile = null;

/* ── plumbing ─────────────────────────────────────────────────────────── */

function toast(message, bad = false) {
  const el = $("toast");
  el.textContent = message;
  el.className = "toast show" + (bad ? " bad" : "");
  clearTimeout(el._timer);
  el._timer = setTimeout(() => (el.className = "toast"), 3600);
}

async function api(path, { method = "GET", body, auth = true } = {}) {
  const headers = {};
  if (auth && token) headers.Authorization = "Bearer " + token;
  if (body && !(body instanceof FormData)) headers["Content-Type"] = "application/json";

  const res = await fetch(path, {
    method,
    headers,
    body: body instanceof FormData ? body : body ? JSON.stringify(body) : undefined,
  });

  const data = await res.json().catch(() => ({}));

  if (!res.ok) {
    if (res.status === 401 && token) signOut();
    const detail = data.details ? " — " + Object.values(data.details).join(", ") : "";
    throw new Error((data.error || res.statusText) + detail);
  }
  return data;
}

/* ── session ──────────────────────────────────────────────────────────── */

function showApp(email) {
  $("loginView").classList.add("hide");
  $("appView").classList.remove("hide");
  $("logout").classList.remove("hide");
  $("who").textContent = email;
  loadCategories().then(loadProducts).catch((err) => toast(err.message, true));
}

function signOut() {
  token = "";
  localStorage.removeItem("decomerce_token");
  $("appView").classList.add("hide");
  $("logout").classList.add("hide");
  $("who").textContent = "";
  $("loginView").classList.remove("hide");
}

$("signin").onclick = async () => {
  try {
    const { token: issued, admin } = await api("/api/auth/login", {
      method: "POST",
      auth: false,
      body: { email: $("email").value, password: $("password").value },
    });
    token = issued;
    localStorage.setItem("decomerce_token", issued);
    $("password").value = "";
    showApp(admin.email);
    toast("Signed in");
  } catch (err) {
    toast(err.message, true);
  }
};

$("password").addEventListener("keydown", (event) => {
  if (event.key === "Enter") $("signin").click();
});

$("logout").onclick = () => {
  signOut();
  toast("Signed out");
};

/* ── catalogue ────────────────────────────────────────────────────────── */

function escapeHtml(value) {
  const map = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
  return String(value ?? "").replace(/[&<>"']/g, (char) => map[char]);
}

function option(value, label = value) {
  return "<option value=\"" + escapeHtml(value) + "\">" + escapeHtml(label) + "</option>";
}

async function loadCategories() {
  const { categories, badges } = await api("/api/products/categories", { auth: false });

  $("category").innerHTML = categories.map((c) => option(c)).join("");
  $("filter").innerHTML = option("", "All categories") + categories.map((c) => option(c)).join("");
  $("badge").innerHTML = option("", "None") + badges.map((b) => option(b)).join("");
}

async function loadProducts() {
  const params = new URLSearchParams({ includeUnpublished: "true", limit: "100" });
  if ($("search").value.trim()) params.set("q", $("search").value.trim());
  if ($("filter").value) params.set("category", $("filter").value);

  const { products, total } = await api("/api/products?" + params);

  $("count").textContent = total ? "· " + total : "";
  $("empty").classList.toggle("hide", products.length > 0);

  $("rows").innerHTML = products
    .map((p) => {
      const photo = p.img
        ? "<img src=\"" + escapeHtml(p.img) + "\" alt=\"\" loading=\"lazy\" />"
        : "";
      const badge = p.badge
        ? "<div class=\"muted\" style=\"margin-top:4px\">" + escapeHtml(p.badge) + "</div>"
        : "";

      return [
        "<tr>",
        "<td>" + photo + "</td>",
        "<td><strong>" + escapeHtml(p.name) + "</strong>",
        "<div class=\"muted\">" + escapeHtml(p.spec) + "</div></td>",
        "<td class=\"muted\">" + escapeHtml(p.category) + "</td>",
        "<td><span class=\"pill " + (p.published ? "on" : "") + "\">" +
          (p.published ? "Live" : "Draft") + "</span>" + badge + "</td>",
        "<td><div class=\"actions\">",
        "<button class=\"ghost\" data-edit=\"" + p.id + "\">Edit</button>",
        "<button class=\"danger\" data-del=\"" + p.id + "\">Delete</button>",
        "</div></td></tr>",
      ].join("");
    })
    .join("");

  $("rows").querySelectorAll("[data-edit]").forEach((button) => {
    button.onclick = () =>
      startEdit(products.find((p) => p.id === Number(button.dataset.edit)));
  });
  $("rows").querySelectorAll("[data-del]").forEach((button) => {
    button.onclick = () => remove(Number(button.dataset.del));
  });
}

let searchTimer;
$("search").oninput = () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => loadProducts().catch((err) => toast(err.message, true)), 250);
};
$("filter").onchange = () => loadProducts().catch((err) => toast(err.message, true));

/* ── the form ─────────────────────────────────────────────────────────── */

const drop = $("drop");

drop.onclick = () => $("file").click();
drop.ondragover = (event) => {
  event.preventDefault();
  drop.classList.add("hot");
};
drop.ondragleave = () => drop.classList.remove("hot");
drop.ondrop = (event) => {
  event.preventDefault();
  drop.classList.remove("hot");
  if (event.dataTransfer.files[0]) setFile(event.dataTransfer.files[0]);
};
$("file").onchange = (event) => {
  if (event.target.files[0]) setFile(event.target.files[0]);
};

function setFile(file) {
  pickedFile = file;
  const preview = URL.createObjectURL(file);
  $("dropInner").innerHTML =
    "<img src=\"" + preview + "\" alt=\"\" />" +
    "<strong>" + escapeHtml(file.name) + "</strong>" +
    "<div class=\"muted\">" + (file.size / 1024 / 1024).toFixed(2) +
    " MB · click to replace</div>";
}

function resetFileBox(currentUrl) {
  pickedFile = null;
  $("file").value = "";
  $("dropInner").innerHTML = currentUrl
    ? "<img src=\"" + escapeHtml(currentUrl) + "\" alt=\"\" />" +
      "<div class=\"muted\">Current photo · click to replace</div>"
    : "<strong>Choose an image</strong>" +
      "<div class=\"muted\">or drag it here · jpg, png, webp, avif · max 5MB</div>";
}

function startEdit(product) {
  editingId = product.id;
  $("formTitle").textContent = "Edit #" + product.id;
  $("name").value = product.name;
  $("category").value = product.category;
  $("spec").value = product.spec || "";
  $("badge").value = product.badge || "";
  $("published").value = String(product.published);
  $("imageUrl").value = "";
  resetFileBox(product.img);
  $("cancel").classList.remove("hide");
  $("save").textContent = "Save changes";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function resetForm() {
  editingId = null;
  $("formTitle").textContent = "Add a product";
  $("name").value = "";
  $("spec").value = "";
  $("imageUrl").value = "";
  $("badge").value = "";
  $("published").value = "true";
  resetFileBox(null);
  $("cancel").classList.add("hide");
  $("save").textContent = "Save product";
}

$("cancel").onclick = resetForm;

$("save").onclick = async () => {
  const form = new FormData();
  form.append("name", $("name").value.trim());
  form.append("category", $("category").value);
  form.append("spec", $("spec").value.trim());
  form.append("badge", $("badge").value);
  form.append("published", $("published").value);

  if (pickedFile) form.append("image", pickedFile);
  else if ($("imageUrl").value.trim()) form.append("imageUrl", $("imageUrl").value.trim());

  $("save").disabled = true;
  try {
    if (editingId) {
      await api("/api/products/" + editingId, { method: "PATCH", body: form });
      toast("Product updated");
    } else {
      await api("/api/products", { method: "POST", body: form });
      toast("Product added");
    }
    resetForm();
    await loadProducts();
  } catch (err) {
    toast(err.message, true);
  } finally {
    $("save").disabled = false;
  }
};

async function remove(id) {
  if (!confirm("Delete product #" + id + "? This also removes its photo.")) return;

  try {
    await api("/api/products/" + id, { method: "DELETE" });
    if (editingId === id) resetForm();
    toast("Product deleted");
    await loadProducts();
  } catch (err) {
    toast(err.message, true);
  }
}

/* ── start ────────────────────────────────────────────────────────────── */

resetFileBox(null);

if (token) {
  api("/api/auth/me")
    .then(({ admin }) => showApp(admin.email))
    .catch(() => signOut());
}
</script>
</body>
</html>
